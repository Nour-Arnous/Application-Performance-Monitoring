{% extends 'base.html' %}
{% load static %}

{% block title %}Login - APM{% endblock %}

{% block content %}
<!-- Centered Authentication Container Layout -->
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        
        <!-- Main Card Container for Login Form -->
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            
            <!-- Card Header with Primary Gradient Theme -->
            <div class="bg-primary bg-gradient p-4 text-white text-center">
                <div class="mb-2">
                    <i class="fas fa-sign-in-alt fa-2x"></i>
                </div>
                <h3 class="fw-bold mb-0">Welcome Back</h3>
                <p class="text-white-50 small mb-0">Sign in to your APM dashboard</p>
            </div>

            <!-- Card Body Content -->
            <div class="card-body p-4 bg-white">
                <form method="post">
                    {% csrf_token %}
                    
                    <!-- Username Field Group -->
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold text-secondary">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control rounded-3 py-2" 
                               placeholder="Enter your username" required autofocus>
                    </div>
                    
                    <!-- Password Field Group -->
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold text-secondary">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control rounded-3 py-2" 
                               placeholder="Enter your password" required>
                    </div>
                    
                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary py-2 fw-bold shadow-sm rounded-pill">
                            <i class="fas fa-sign-in-alt me-2"></i> Login
                        </button>
                    </div>
                    
                    <!-- Registration Redirect Link -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none">Create new account</a>
                        </p>
                    </div>
                </form>
            </div>
            
        </div>

    </div>
</div>
{% endblock %}
